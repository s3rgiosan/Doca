name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the package.json version $version."
            exit 1
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build the extension zip
        run: npx wxt zip

      - name: Write the release notes
        run: |
          awk -v heading="## [$GITHUB_REF_NAME]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^(## \[|\[[^]]+\]: )/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=".output/doca-${GITHUB_REF_NAME}-chrome.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
